<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../shared/theme.css" />
<title>Diff Checker</title>
<meta name="description" content="Compare two texts line by line — see added, removed and unchanged lines." />
<style>
.page{max-width:1100px;margin:0 auto;padding:48px 24px 72px}
.hero{margin-bottom:28px}
.eyebrow{text-transform:uppercase;letter-spacing:0.2em;font-size:0.8rem;color:#94a3b8;margin:0 0 10px}
.hero h1{margin:0;font-size:clamp(2.2rem,4vw,3rem);color:#f8fafc}
.lede{margin-top:10px;color:#cbd5f5;max-width:720px;line-height:1.6}
.hero-links{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap}
.hero-links a{color:#38bdf8;font-weight:500;text-decoration:none}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:700px){.inputs{grid-template-columns:1fr}}
.card{border-radius:20px;padding:24px;background:rgba(15,23,42,0.85);border:1px solid rgba(148,163,184,0.3);box-shadow:0 20px 40px rgba(2,6,23,0.65)}
.card label{font-size:0.85rem;letter-spacing:0.08em;text-transform:uppercase;color:#94a3b8;display:block;margin-bottom:8px;font-weight:600}
textarea{width:100%;min-height:180px;border-radius:14px;border:1px solid rgba(226,232,240,0.25);background:rgba(15,23,42,0.9);color:#e2e8f0;font-family:ui-monospace,monospace;font-size:0.85rem;padding:12px;resize:vertical;line-height:1.5}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{padding:11px 22px;border-radius:14px;border:none;font-size:0.92rem;font-weight:600;cursor:pointer;font-family:inherit}
button.primary{background:linear-gradient(135deg,#38bdf8,#6366f1);color:#fff}
button.secondary{background:rgba(148,163,184,0.18);border:1px solid rgba(148,163,184,0.35);color:#e2e8f0}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:0.88rem}
.stat{padding:6px 14px;border-radius:999px;font-weight:600}
.stat.added{background:rgba(34,197,94,0.15);color:#86efac;border:1px solid rgba(34,197,94,0.4)}
.stat.removed{background:rgba(239,68,68,0.15);color:#fca5a5;border:1px solid rgba(239,68,68,0.4)}
.stat.unchanged{background:rgba(148,163,184,0.12);color:#94a3b8;border:1px solid rgba(148,163,184,0.25)}
.diff-output{margin-top:20px;border-radius:16px;overflow:hidden;border:1px solid rgba(148,163,184,0.2);background:rgba(2,6,23,0.9)}
.diff-line{font-family:ui-monospace,monospace;font-size:0.82rem;line-height:1.6;padding:2px 14px;white-space:pre-wrap;word-break:break-all;display:flex;gap:10px}
.diff-line .prefix{flex-shrink:0;width:18px;text-align:center;font-weight:700}
.diff-line.added{background:rgba(34,197,94,0.13);color:#bbf7d0}
.diff-line.removed{background:rgba(239,68,68,0.13);color:#fecaca}
.diff-line.unchanged{color:#94a3b8}
.diff-line .ln{color:#475569;flex-shrink:0;width:36px;text-align:right;font-size:0.75rem;user-select:none}
.empty-msg{padding:24px;text-align:center;color:#64748b;font-size:0.9rem}
</style>
</head>
<body>
<main class="page">
<header class="hero">
<p class="eyebrow">Compare texts</p>
<h1>Diff Checker</h1>
<p class="lede">Paste original and modified text. Computes a line-level diff in your browser — no data leaves the page.</p>
<div class="hero-links"><a href="../">← Back to hub</a></div>
</header>

<div class="inputs">
<div class="card">
<label for="original">Original</label>
<textarea id="original" placeholder="Paste original text…"></textarea>
</div>
<div class="card">
<label for="modified">Modified</label>
<textarea id="modified" placeholder="Paste modified text…"></textarea>
</div>
</div>

<div class="btn-row">
<button class="primary" id="compareBtn">Compare</button>
<button class="secondary" id="swapBtn">Swap</button>
<button class="secondary" id="clearBtn">Clear</button>
</div>

<div class="stats" id="stats"></div>
<div class="diff-output" id="output"><div class="empty-msg">Click Compare to see diff.</div></div>
</main>
<script>
const $ = id => document.getElementById(id);
const origEl = $('original'), modEl = $('modified'), outEl = $('output'), statsEl = $('stats');

function diffLines(a, b) {
  const m = a.length, n = b.length;
  // LCS DP table
  const dp = Array.from({length: m+1}, () => Array(n+1).fill(0));
  for (let i = m-1; i >= 0; i--) {
    for (let j = n-1; j >= 0; j--) {
      dp[i][j] = a[i] === b[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
    }
  }
  const ops = [];
  let i=0, j=0;
  while (i < m || j < n) {
    if (i < m && j < n && a[i] === b[j]) { ops.push({type:'unchanged', line:a[i]}); i++; j++; }
    else if (j < n && (i >= m || dp[i][j+1] >= dp[i+1][j])) { ops.push({type:'added', line:b[j]}); j++; }
    else { ops.push({type:'removed', line:a[i]}); i++; }
  }
  return ops;
}

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function render() {
  const aText = origEl.value, bText = modEl.value;
  // handle empty both as empty array
  const a = aText === '' ? [] : aText.split('\n');
  const b = bText === '' ? [] : bText.split('\n');
  // special: if both empty
  if (a.length===0 && b.length===0) {
    outEl.innerHTML='<div class="empty-msg">Both inputs are empty.</div>';
    statsEl.innerHTML='';
    return;
  }
  const ops = diffLines(a, b);
  let added=0, removed=0, unchanged=0;
  ops.forEach(o=>{ if(o.type==='added')added++; else if(o.type==='removed')removed++; else unchanged++; });
  statsEl.innerHTML =
    '<span class="stat added">+ '+added+' added</span>' +
    '<span class="stat removed">− '+removed+' removed</span>' +
    '<span class="stat unchanged">'+unchanged+' unchanged</span>';
  let html='';
  let ao=1, bo=1;
  ops.forEach(o=>{
    if(o.type==='added'){ html+='<div class="diff-line added"><span class="prefix">+</span><span class="ln">'+bo+'</span><span>'+esc(o.line)+'</span></div>'; bo++; }
    else if(o.type==='removed'){ html+='<div class="diff-line removed"><span class="prefix">−</span><span class="ln">'+ao+'</span><span>'+esc(o.line)+'</span></div>'; ao++; }
    else { html+='<div class="diff-line unchanged"><span class="prefix"> </span><span class="ln">'+ao+'</span><span>'+esc(o.line)+'</span></div>'; ao++; bo++; }
  });
  outEl.innerHTML = html;
}

$('compareBtn').addEventListener('click', render);
$('clearBtn').addEventListener('click', ()=>{ origEl.value=''; modEl.value=''; statsEl.innerHTML=''; outEl.innerHTML='<div class="empty-msg">Click Compare to see diff.</div>'; });
$('swapBtn').addEventListener('click', ()=>{ const t=origEl.value; origEl.value=modEl.value; modEl.value=t; if(statsEl.innerHTML) render(); });
</script>
</body>
</html>
